<!doctype html>
<html lang="zh-CN" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07110b" />
  <link rel="icon" href="/favicon.ico" />
  <title>clark-typer · 克拉克打字机</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap"
    rel="stylesheet" />
  <style>
    html[data-theme="dark"] {
      background: #07110b;
    }

    html[data-theme="light"] {
      background: #e9f1e2;
    }
  </style>
  <script>
    try {
      if (localStorage.getItem("clark-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch {
      /* localStorage unavailable */
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
