<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="200" height="200">
  <defs>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <style>
      @keyframes blink { 0%,100%{ opacity:1; } 50%{ opacity:0.1; } }
      #cursor { animation: blink 1.4s infinite; }
    </style>
  </defs>

  <!-- ===== 纸 ===== -->
  <!-- 纸从滚筒上方伸出 -->
  <path d="M300 200 L300 340 L684 340 L684 200 Z" fill="#FAFAFA" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- 纸上方撕边 -->
  <path d="M300 200 L320 188 L340 200 L360 188 L380 200 L400 188 L420 200 L440 188 L460 200 L480 188 L500 200 L520 188 L540 200 L560 188 L580 200 L600 188 L620 200 L640 188 L660 200 L684 200"
        fill="none" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- 纸上文字行 — 黑色（人类） -->
  <g stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="330" y1="236" x2="480" y2="236"/>
    <line x1="330" y1="260" x2="520" y2="260"/>
    <line x1="330" y1="284" x2="470" y2="284"/>
  </g>
  <!-- 纸上文字行 — 橙色（AI续写） -->
  <g stroke="url(#orangeGrad)" stroke-width="4" stroke-linecap="round">
    <line x1="496" y1="236" x2="654" y2="236"/>
    <line x1="536" y1="260" x2="654" y2="260"/>
    <line x1="486" y1="284" x2="654" y2="284"/>
  </g>
  <!-- 光标 -->
  <line id="cursor" x1="658" y1="236" x2="658" y2="260" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== 滚筒（platen）===== -->
  <rect x="270" y="340" width="444" height="28" rx="14" fill="#1A1A1A"/>
  <!-- 滚筒高光 -->
  <rect x="280" y="344" width="424" height="6" rx="3" fill="#FFFFFF" opacity="0.12"/>
  <!-- 滚筒旋钮 左 -->
  <ellipse cx="270" cy="354" rx="14" ry="20" fill="#1A1A1A"/>
  <ellipse cx="270" cy="354" rx="8" ry="12" fill="#444"/>
  <!-- 滚筒旋钮 右 -->
  <ellipse cx="714" cy="354" rx="14" ry="20" fill="#1A1A1A"/>
  <ellipse cx="714" cy="354" rx="8" ry="12" fill="#444"/>

  <!-- ===== 压纸杆（paper bail）===== -->
  <line x1="300" y1="340" x2="684" y2="340" stroke="#333" stroke-width="3"/>
  <!-- 压纸滚轮 -->
  <circle cx="340" cy="340" r="6" fill="#1A1A1A"/>
  <circle cx="492" cy="340" r="6" fill="#1A1A1A"/>
  <circle cx="644" cy="340" r="6" fill="#1A1A1A"/>

  <!-- ===== 纸从滚筒后方垂下的可见部分 ===== -->
  <rect x="320" y="368" width="344" height="50" fill="#FAFAFA" opacity="0.6"/>
  <path d="M320 368 L320 418 L664 418 L664 368 Z" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.2"/>

  <!-- ===== 色带（ribbon）===== -->
  <rect x="280" y="370" width="424" height="8" rx="2" fill="#1A1A1A"/>

  <!-- ===== typebars（打字臂扇形阵列）===== -->
  <!-- 左侧 typebars — 黑色 -->
  <g stroke="#1A1A1A" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.6">
    <line x1="492" y1="382" x2="140" y2="620"/>
    <line x1="492" y1="382" x2="170" y2="634"/>
    <line x1="492" y1="382" x2="200" y2="646"/>
    <line x1="492" y1="382" x2="230" y2="656"/>
    <line x1="492" y1="382" x2="260" y2="664"/>
    <line x1="492" y1="382" x2="290" y2="670"/>
    <line x1="492" y1="382" x2="320" y2="674"/>
    <line x1="492" y1="382" x2="350" y2="676"/>
  </g>
  <!-- 右侧 typebars — 橙色（AI侧） -->
  <g stroke="url(#orangeGrad)" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.7">
    <line x1="532" y1="382" x2="884" y2="620"/>
    <line x1="532" y1="382" x2="854" y2="634"/>
    <line x1="532" y1="382" x2="824" y2="646"/>
    <line x1="532" y1="382" x2="794" y2="656"/>
    <line x1="532" y1="382" x2="764" y2="664"/>
    <line x1="532" y1="382" x2="734" y2="670"/>
    <line x1="532" y1="382" x2="704" y2="674"/>
    <line x1="532" y1="382" x2="674" y2="676"/>
  </g>

  <!-- ===== 键盘区域 ===== -->
  <!-- 键盘底板 -->
  <path d="M130 640 L130 700 Q130 722 152 722 L832 722 Q854 722 854 700 L854 640 Z"
        fill="#1A1A1A" opacity="0.08"/>

  <!-- 第一排（数字/符号） -->
  <g fill="#1A1A1A">
    <rect x="150" y="652" width="52" height="32" rx="4"/>
    <rect x="210" y="652" width="52" height="32" rx="4"/>
    <rect x="270" y="652" width="52" height="32" rx="4"/>
    <rect x="330" y="652" width="52" height="32" rx="4"/>
    <rect x="390" y="652" width="52" height="32" rx="4"/>
    <rect x="450" y="652" width="52" height="32" rx="4"/>
    <rect x="510" y="652" width="52" height="32" rx="4"/>
    <rect x="570" y="652" width="52" height="32" rx="4"/>
    <rect x="630" y="652" width="52" height="32" rx="4"/>
    <rect x="690" y="652" width="52" height="32" rx="4"/>
    <rect x="750" y="652" width="52" height="32" rx="4"/>
  </g>

  <!-- 第二排 -->
  <g fill="#1A1A1A" opacity="0.7">
    <rect x="170" y="692" width="52" height="32" rx="4"/>
    <rect x="230" y="692" width="52" height="32" rx="4"/>
    <rect x="290" y="692" width="52" height="32" rx="4"/>
    <rect x="350" y="692" width="52" height="32" rx="4"/>
    <rect x="410" y="692" width="52" height="32" rx="4"/>
    <rect x="470" y="692" width="52" height="32" rx="4"/>
    <rect x="530" y="692" width="52" height="32" rx="4"/>
    <rect x="590" y="692" width="52" height="32" rx="4"/>
    <rect x="650" y="692" width="52" height="32" rx="4"/>
    <rect x="710" y="692" width="52" height="32" rx="4"/>
  </g>

  <!-- 空格键 -->
  <rect x="290" y="735" width="364" height="28" rx="5" fill="url(#orangeGrad)" opacity="0.9"/>

  <!-- ===== 底部文字 ===== -->
  <text x="512" y="830" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="50" font-weight="800" letter-spacing="14" fill="#1A1A1A">CLARK·TYPER</text>
  <text x="512" y="880" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" letter-spacing="10" fill="#1A1A1A" opacity="0.35">HUMAN × AI 共创</text>
</svg>
